name: Rust

on:
  push:
    tags:
      - '*'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_upload_ubuntu:
    name: Build and upload Ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install OS dependencies
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      
      - name: Install tauri-cli
        run: cargo binstall tauri-cli
      - name: Install trunk
        run: cargo binstall trunk
      - name: Install wasm-bindgen-cli
        run: cargo binstall wasm-bindgen-cli
      - name: Install target
        run: rustup target add wasm32-unknown-unknown

      - name: Build
        run: cargo tauri build

      - name: Upload
        uses: actions/upload-artifact@v4.4.3
        with:
          name: 'pts_bomber_ubuntu'
          path: |
            /home/runner/work/pts_bomber/pts_bomber/target/release/pts_bomber
            /home/runner/work/pts_bomber/pts_bomber/target/release/bundle/deb/pts_bomber_*_amd64.deb
            /home/runner/work/pts_bomber/pts_bomber/target/release/bundle/rpm/pts_bomber-*-1.x86_64.rpm
            /home/runner/work/pts_bomber/pts_bomber/target/release/bundle/appimage/pts_bomber_*_amd64.AppImage
          compression-level: 9
          if-no-files-found: error
  build_upload_windows:
    name: Build and upload Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install OS dependencies
        run: Set-ExecutionPolicy Unrestricted -Scope Process; iex (iwr "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.ps1").Content
      
      - name: Install tauri-cli
        run: cargo binstall tauri-cli
      - name: Install trunk
        run: cargo binstall trunk
      - name: Install wasm-bindgen-cli
        run: cargo binstall wasm-bindgen-cli
      - name: Install target
        run: rustup target add wasm32-unknown-unknown

      - name: Build
        run: cargo tauri build

      - name: Upload
        uses: actions/upload-artifact@v4.4.3
        with:
          name: 'pts_bomber_windows'
          path: |
            D:\a\pts_bomber\pts_bomber\target\release\pts_bomber.exe
            D:\a\pts_bomber\pts_bomber\target\release\bundle\msi\pts_bomber_*_x64_en-US.msi
            D:\a\pts_bomber\pts_bomber\target\release\bundle\nsis\pts_bomber_*_x64-setup.exe
          compression-level: 9
          if-no-files-found: error
  build_upload_macos:
    name: Build and upload macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install OS dependencies
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      
      - name: Install tauri-cli
        run: cargo binstall tauri-cli
      - name: Install trunk
        run: cargo binstall trunk
      - name: Install wasm-bindgen-cli
        run: cargo binstall wasm-bindgen-cli      
      - name: Install target
        run: rustup target add wasm32-unknown-unknown

      - name: Build
        run: cargo tauri build

      - name: Upload
        uses: actions/upload-artifact@v4.4.3
        with:
          name: 'pts_bomber_macos'
          path: |
            /Users/runner/work/pts_bomber/pts_bomber/target/release/pts_bomber
            /Users/runner/work/pts_bomber/pts_bomber/target/release/bundle/macos/pts_bomber.app
             /Users/runner/work/pts_bomber/pts_bomber/target/release/bundle/dmg/pts_bomber_*_aarch64.dmg
          compression-level: 9
          if-no-files-found: error